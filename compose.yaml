services:
  mangoo:
    image: mangoo:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangoo-core
    ports:
      - "47321:47321"
    environment:
      # Front-of-house auth for browser access. Set to `user:pass` to enable.
      # Development quickstart remains explicitly authenticated. Override this
      # value in production rather than exposing an unauthenticated Core.
      MANGOO_BASIC_AUTH: ${MANGOO_BASIC_AUTH:-mangoo:change-me}
      # Desktop session-token enforcement. Leave unset when running a browser
      # deployment behind Basic auth; set to a strong token if you also want
      # the desktop X-Mangoo-Session check active.
      MANGOO_SESSION_TOKEN: ${MANGOO_SESSION_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - mangoo-data:/data
      - ${MANGOO_LIBRARY_PATH:-./library}:/library:ro
      - ${MANGOO_SECRET_KEY_FILE:-./secrets/mangoo_secret_key}:/run/secrets/mangoo_secret_key:ro
    restart: unless-stopped

volumes:
  mangoo-data:
