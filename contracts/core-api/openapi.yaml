openapi: 3.1.0
info:
  title: Megle Core API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:{port}/api
    variables:
      port:
        default: "47321"
security:
  - sessionToken: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Core is alive.
  /libraries:
    get:
      operationId: listLibraries
      responses:
        "200":
          description: Libraries registered on this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
    post:
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Managed local-only library created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryResponse"
        "400":
          description: Invalid name or managed-root selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: The root conflicts with an existing library or changed after preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/active:
    get:
      operationId: getActiveLibrary
      responses:
        "200":
          description: Active library context, or null when first-run has no library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLibraryResponse"
  /libraries/preflight:
    post:
      operationId: preflightLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryPreflightRequest"
      responses:
        "200":
          description: Authoritative managed-root preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPreflightResponse"
  /libraries/{libraryUuid}/activate:
    post:
      operationId: activateLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "200":
          description: Library activated without restarting Core.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLibraryResponse"
        "404":
          description: Library not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Library unavailable or lifecycle transition already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/{libraryUuid}/local-copy:
    delete:
      operationId: removeLocalLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "204":
          description: Local-only managed library quarantined and removed from the registry.
        "404":
          description: Library not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Identity mismatch, non-local binding, or lifecycle conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/{libraryUuid}/sync-binding:
    post:
      operationId: enableLibrarySync
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableLibrarySyncRequest"
      responses:
        "200":
          description: Provider-neutral local capture enabled and fenced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
        "409":
          description: Stale context or an existing binding.
    delete:
      operationId: unbindLibrarySync
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "204":
          description: Local capture and transport binding removed; remote data remains.
  /sync/status:
    get:
      operationId: getSyncStatus
      responses:
        "200":
          description: Revisioned Host-wide synchronization snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusSnapshot"
  /sync/wake:
    post:
      operationId: wakeSyncScheduler
      parameters:
        - in: query
          name: reason
          required: false
          schema: { type: string, enum: [foreground, network, manual] }
      responses:
        "204":
          description: Eligible bindings were made immediately runnable.
  /sync/remote-libraries:
    get:
      operationId: listRemoteLibraries
      responses:
        "200":
          description: Provider-neutral remote Library inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteLibraryListResponse"
  /sync/restores:
    post:
      operationId: startSyncRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRestoreStartRequest"
      responses:
        "200":
          description: Restore plans accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestoreListResponse"
  /sync/restores/preflight:
    post:
      operationId: preflightSyncRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRestorePreflightRequest"
      responses:
        "200":
          description: Aggregate multi-Library restore preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestorePreflight"
  /sync/restores/{restoreUuid}:
    get:
      operationId: getSyncRestore
      parameters:
        - $ref: "#/components/parameters/restoreUuid"
      responses:
        "200":
          description: Restore progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestorePlan"
  /sync/restores/{restoreUuid}/pause:
    post:
      operationId: pauseSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Restore paused., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /sync/restores/{restoreUuid}/resume:
    post:
      operationId: resumeSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Restore resumed., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /sync/restores/{restoreUuid}/cancel:
    post:
      operationId: cancelSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Pre-catalog restore cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /libraries/{libraryUuid}/sync/preflight:
    post:
      operationId: preflightLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPreflightRequest" } } } }
      responses: { "200": { description: Sync preflight result., content: { application/json: { schema: { $ref: "#/components/schemas/SyncPreflightResponse" } } } } }
  /libraries/{libraryUuid}/sync/enable:
    post:
      operationId: startLibrarySyncEnable
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncEnableRequest" } } } }
      responses: { "200": { description: Enable operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/pause:
    post:
      operationId: pauseLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Pause operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/resume:
    post:
      operationId: resumeLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Resume operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/sync-now:
    post:
      operationId: syncLibraryNow
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Manual wake operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/retry:
    post:
      operationId: retryLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Retry operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/unbind-plan:
    post:
      operationId: planLibrarySyncUnbind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses: { "200": { description: Frozen unbind plan., content: { application/json: { schema: { $ref: "#/components/schemas/SyncUnbindPlan" } } } } }
  /libraries/{libraryUuid}/sync/unbind-commit:
    post:
      operationId: commitLibrarySyncUnbind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncUnbindCommitRequest" } } } }
      responses: { "200": { description: Unbind operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/reconnect-preflight:
    post:
      operationId: preflightLibrarySyncReconnect
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectPreflightRequest" } } } }
      responses: { "200": { description: Reconnect plan., content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectPlan" } } } } }
  /libraries/{libraryUuid}/sync/reconnect-commit:
    post:
      operationId: commitLibrarySyncReconnect
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectCommitRequest" } } } }
      responses: { "200": { description: Reconnect operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/conflicts:
    get:
      operationId: listLibrarySyncConflicts
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses: { "200": { description: Library conflicts., content: { application/json: { schema: { $ref: "#/components/schemas/SyncConflictListResponse" } } } } }
  /libraries/{libraryUuid}/sync/conflicts/{conflictUuid}/resolve:
    post:
      operationId: resolveLibrarySyncConflict
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/conflictUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncConflictResolutionRequest" } } } }
      responses: { "200": { description: Conflict resolution operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/diagnostics:
    get:
      operationId: getLibrarySyncDiagnostics
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses: { "200": { description: Redacted diagnostics., content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /libraries/{libraryUuid}/sync/diagnostics/export:
    post:
      operationId: exportLibrarySyncDiagnostics
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses: { "200": { description: Redacted diagnostics export., content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /libraries/{libraryUuid}:
    patch:
      operationId: updateLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Library display metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
        "404":
          description: Library not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Stale active Library context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /roots:
    get:
      operationId: listRoots
      responses:
        "200":
          description: Existing indexed roots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootListResponse"
    post:
      operationId: addRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootRequest"
      responses:
        "202":
          description: Root accepted and scan task queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "400":
          description: Root path does not exist, cannot be opened, or is not a directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /roots/{rootId}:
    delete:
      operationId: removeRoot
      parameters:
        - $ref: "#/components/parameters/rootId"
      responses:
        "202":
          description: Root disabled or removed from index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Root not found or already disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders/{folderId}/children:
    get:
      operationId: listFolderChildren
      parameters:
        - $ref: "#/components/parameters/folderId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: includeDescendants
          in: query
          description: Include descendant folders recursively under the requested folder.
          schema:
            type: boolean
      responses:
        "200":
          description: Child folders for lazy folder-tree loading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"
        "400":
          description: Invalid folder children cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Folder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders/{folderId}/ancestors:
    get:
      operationId: listFolderAncestors
      description: Return the target folder's path from its library root to the target folder.
      parameters:
        - $ref: "#/components/parameters/folderId"
      responses:
        "200":
          description: Ordered folder path from the library root to the target folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"
        "404":
          description: Folder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media:
    get:
      operationId: listMedia
      parameters:
        - $ref: "#/components/parameters/rootIdQuery"
        - $ref: "#/components/parameters/folderIdQuery"
        - name: includeDescendants
          in: query
          description: Include media from descendant folders when folderId is set.
          schema:
            type: boolean
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/cursor"
        - name: sort
          in: query
          schema:
            type: string
            enum: [mtime_desc, mtime_asc, name_asc, name_desc]
            default: mtime_desc
        - name: kind
          in: query
          schema:
            type: string
            enum: [image, video, other]
      responses:
        "200":
          description: Keyset-paged media result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
        "400":
          description: Invalid media query parameter or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{fileId}:
    get:
      operationId: getMedia
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: Single media item and derived metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRecord"
        "404":
          description: Media item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{fileId}/position:
    get:
      operationId: getMediaPosition
      parameters:
        - $ref: "#/components/parameters/fileId"
        - in: query
          name: rootId
          schema: { type: integer }
        - in: query
          name: folderId
          schema: { type: integer }
        - in: query
          name: includeDescendants
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          schema:
            type: string
            enum: [mtime_desc, mtime_asc, name_asc, name_desc]
      responses:
        "200":
          description: Zero-based position in the requested media scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPositionResponse"
        "404":
          description: Media item not found in the requested scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{fileId}/thumbnail:
    get:
      operationId: getThumbnail
      parameters:
        - $ref: "#/components/parameters/fileId"
        - $ref: "#/components/parameters/target"
        - $ref: "#/components/parameters/thumbnailPriority"
      responses:
        "200":
          description: Thumbnail state is ready or terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailResponse"
        "202":
          description: Thumbnail is pending or queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailResponse"
        "400":
          description: Unsupported thumbnail target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Media item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{fileId}/thumbnail/blob:
    get:
      operationId: getThumbnailBlob
      parameters:
        - $ref: "#/components/parameters/fileId"
        - $ref: "#/components/parameters/target"
      responses:
        "200":
          description: Generated thumbnail bytes (WebP).
          headers:
            x-megle-served-by:
              schema:
                type: string
                enum: [db_blob]
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Thumbnail not ready or unsupported target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Media item or thumbnail BLOB not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /thumbnails/cache/stats:
    get:
      operationId: getThumbnailCacheStats
      parameters:
        - name: rootId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: folderId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: includeDescendants
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Persistent thumbnail cache stats for the requested scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailCacheSnapshotResponse"
  /thumbnails/cache/failures:
    get:
      operationId: listThumbnailCacheFailures
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Bounded authoritative thumbnail failure details for the active library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailFailureListResponse"
  /thumbnails/cache/clear:
    post:
      operationId: clearThumbnailCache
      responses:
        "200":
          description: Persistent thumbnail cache cleared and thumbnail states reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailCacheClearResponse"
  /thumbnails/cache/cancel-bulk:
    post:
      operationId: cancelBulkThumbnailCache
      description: >-
        Cancel every pending whole-library (bulk-priority) thumbnail task,
        leaving viewport/selected/ahead tasks and generated blobs untouched.
        Used when the generation mode is not whole-library ("renderedOnly" /
        "cacheOnly") to drop a leftover bulk queue from a previous session.
      responses:
        "200":
          description: Pending bulk thumbnail tasks cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailCacheCancelBulkResponse"
  /media/{fileId}/preview:
    get:
      operationId: getPreview
      description: >-
        Resolves the best preview source for one media item. Browser-renderable
        images at or below the tier threshold, and every video, stream the
        original indexed bytes unchanged. Larger images return an adaptive
        downscaled WebP tier, and browser-unrenderable images return a
        transcoded WebP. The x-megle-preview-tier response header names which
        representation was served.
      parameters:
        - $ref: "#/components/parameters/fileId"
        - name: viewportLongPx
          in: query
          required: false
          description: >-
            Longest side of the preview viewport in CSS pixels. Omit to receive
            the original bytes verbatim. Values above the maximum are clamped,
            not rejected; a non-integer value is a 400.
          schema:
            type: integer
            minimum: 1
            maximum: 16384
      responses:
        "200":
          description: Original indexed media bytes, or a WebP preview representation.
          headers:
            x-megle-preview-tier:
              description: original | preview_2048 | preview_3072 | preview_native
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Malformed viewportLongPx query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Media item or source file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            Preview generation panicked. A generation FAILURE (no decoder for
            the format, decoder binary missing, unreachable source) is not an
            error here — it degrades to the original bytes with
            x-megle-preview-tier: original — so only an internal panic, which is
            a bug, reaches this status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: Background task list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /tasks/scan:
    post:
      operationId: enqueueScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanTaskRequest"
      responses:
        "202":
          description: Scan task queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Root not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Root is disabled and cannot be scanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/interactive-folder-scan:
    post:
      operationId: enqueueInteractiveFolderScan
