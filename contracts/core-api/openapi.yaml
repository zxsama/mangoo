openapi: 3.1.0
info:
  title: Mangoo Core API
  version: 0.1.0
  description: >-
    Sandbox-delegated UI requests carry both X-Mangoo-Plugin-UI-Id and
    X-Mangoo-Plugin-UI-Epoch from the verified view document. Core validates the
    selected installed lifecycle after obtaining UI admission; missing/malformed
    pairs return 400, unavailable or changed epochs return 409. UI admission
    spans each handler and serializes API plugin lifecycle mutations, including
    discovery and auth callbacks. Engine fences remain authoritative for
    background lifecycle changes. Library mutation context revisions are still required.
    Mutating Library/sync API requests also take exclusive UI admission. After
    admission, delegated scoped targets and stored plans must belong to the
    session plugin and its current account; changes return 409 with code
    plugin-ui-target-changed. Only explicit setup/enrollment and restore paths
    accept an unowned local or absent target as appropriate for that operation.
servers:
  - url: http://127.0.0.1:{port}/api
    variables:
      port:
        default: "47321"
security:
  - sessionToken: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Core is alive.
  /libraries:
    get:
      operationId: listLibraries
      responses:
        "200":
          description: Visible Libraries registered on this device. Forgotten registrations remain reserved internally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
    post:
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Managed local-only library created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryResponse"
        "400":
          description: Invalid name or managed-root selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: The root conflicts with an existing library or changed after preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/open:
    post:
      operationId: openLibrary
      parameters:
        - $ref: "#/components/parameters/contextRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenLibraryRequest"
      responses:
        "200":
          description: Existing committed Mangoo Library registered or made visible; activation is reported separately. Same-Host catalog and appearance are retained. Other Hosts rebuild their own catalog without modifying the selected directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenLibraryResponse"
        "400":
          description: Invalid absolute path or invalid Library marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "404":
          description: Directory or Library marker not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Unsupported or changed identity, overlapping root, local-data collision, or stale context revision. User content is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/{libraryUuid}/registration:
    delete:
      operationId: forgetLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "200":
          description: Registration hidden from the list; all media, markers, catalog, cache and retained registration metadata are preserved. An active target is stopped and cleared atomically, incrementing context revision; an inactive target leaves the active context unchanged. Repeating with the current revision is idempotent. Reopen explicitly to restore visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLibraryResponse"
        "404":
          description: Registration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Stale context revision or lifecycle transition failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/active:
    get:
      operationId: getActiveLibrary
      responses:
        "200":
          description: Active library context, or null when first-run has no library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLibraryResponse"
  /libraries/preflight:
    post:
      operationId: preflightLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryPreflightRequest"
      responses:
        "200":
          description: Authoritative managed-root preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPreflightResponse"
  /libraries/{libraryUuid}/activate:
    post:
      operationId: activateLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "200":
          description: Library activated without restarting Core.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLibraryResponse"
        "404":
          description: Library not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Library unavailable or lifecycle transition already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/{libraryUuid}/local-copy:
    delete:
      operationId: removeLocalLibrary
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "204":
          description: Local-only managed library quarantined and removed from the registry.
        "404":
          description: Library not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
        "409":
          description: Identity mismatch, non-local binding, or lifecycle conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryErrorResponse"
  /libraries/{libraryUuid}/sync-binding:
    post:
      operationId: enableLibrarySync
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableLibrarySyncRequest"
      responses:
        "200":
          description: Provider-neutral local capture enabled and fenced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
        "409":
          description: Stale context or an existing binding.
    delete:
      operationId: unbindLibrarySync
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/contextRevision"
      responses:
        "204":
          description: Local capture and transport binding removed; remote data remains.
  /sync/status:
    get:
      operationId: getSyncStatus
      responses:
        "200":
          description: Revisioned Host-wide synchronization snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusSnapshot"
  /sync/wake:
    post:
      operationId: wakeSyncScheduler
      parameters:
        - in: query
          name: reason
          required: false
          schema: { type: string, enum: [foreground, network, manual] }
      responses:
        "204":
          description: Eligible bindings were made immediately runnable.
  /sync/remote-libraries:
    get:
      operationId: listRemoteLibraries
      responses:
        "200":
          description: Provider-neutral remote Library inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteLibraryListResponse"
  /sync/remote-libraries/{accountUuid}/{libraryUuid}/roots:
    get:
      operationId: listRemoteLibraryRoots
      parameters:
        - name: accountUuid
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/libraryUuid"
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Cached Provider-backed root inventory for one remote Library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteLibraryRootListResponse"
  /sync/restores:
    post:
      operationId: startSyncRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRestoreStartRequest"
      responses:
        "200":
          description: Restore plans accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestoreListResponse"
  /sync/restores/preflight:
    post:
      operationId: preflightSyncRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRestorePreflightRequest"
      responses:
        "200":
          description: Aggregate multi-Library restore preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestorePreflight"
  /sync/restores/{restoreUuid}:
    get:
      operationId: getSyncRestore
      parameters:
        - $ref: "#/components/parameters/restoreUuid"
      responses:
        "200":
          description: Restore progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRestorePlan"
  /sync/restores/{restoreUuid}/pause:
    post:
      operationId: pauseSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Restore paused., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /sync/restores/{restoreUuid}/resume:
    post:
      operationId: resumeSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Restore resumed., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /sync/restores/{restoreUuid}/cancel:
    post:
      operationId: cancelSyncRestore
      parameters: [{ $ref: "#/components/parameters/restoreUuid" }]
      responses: { "200": { description: Pre-catalog restore cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/SyncRestorePlan" } } } } }
  /libraries/{libraryUuid}/sync/preflight:
    post:
      operationId: preflightLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPreflightRequest" } } } }
      responses: { "200": { description: Sync preflight result., content: { application/json: { schema: { $ref: "#/components/schemas/SyncPreflightResponse" } } } } }
  /libraries/{libraryUuid}/sync/enable:
    post:
      operationId: startLibrarySyncEnable
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncEnableRequest" } } } }
      responses: { "200": { description: Enable operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/pause:
    post:
      operationId: pauseLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Pause operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/resume:
    post:
      operationId: resumeLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Resume operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/sync-now:
    post:
      operationId: syncLibraryNow
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Manual wake operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/retry:
    post:
      operationId: retryLibrarySync
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCommandRequest" } } } }
      responses: { "200": { description: Retry operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/unbind-plan:
    post:
      operationId: planLibrarySyncUnbind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses: { "200": { description: Frozen unbind plan., content: { application/json: { schema: { $ref: "#/components/schemas/SyncUnbindPlan" } } } } }
  /libraries/{libraryUuid}/sync/unbind-commit:
    post:
      operationId: commitLibrarySyncUnbind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncUnbindCommitRequest" } } } }
      responses: { "200": { description: Unbind operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/reconnect-preflight:
    post:
      operationId: preflightLibrarySyncReconnect
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectPreflightRequest" } } } }
      responses: { "200": { description: Reconnect plan., content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectPlan" } } } } }
  /libraries/{libraryUuid}/sync/reconnect-commit:
    post:
      operationId: commitLibrarySyncReconnect
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncReconnectCommitRequest" } } } }
      responses: { "200": { description: Reconnect operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync/conflicts:
    get:
      operationId: listLibrarySyncConflicts
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses: { "200": { description: Library conflicts., content: { application/json: { schema: { $ref: "#/components/schemas/SyncConflictListResponse" } } } } }
  /libraries/{libraryUuid}/sync/conflicts/{conflictUuid}/resolve:
    post:
      operationId: resolveLibrarySyncConflict
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/conflictUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncConflictResolutionRequest" } } } }
      responses: { "200": { description: Conflict resolution operation., content: { application/json: { schema: { $ref: "#/components/schemas/SyncOperation" } } } } }
  /libraries/{libraryUuid}/sync-folders:
    get:
      operationId: listSyncFolders
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses:
        "200": { description: Revisioned synchronized-folder inventory., content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderListResponse" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}:
    get:
      operationId: getSyncFolder
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/rootUuid" }]
      responses:
        "200": { description: Synchronized-folder record., content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderRecord" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/settings:
    get:
      operationId: getSyncFolderSettings
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      responses:
        "200": { description: Device-local placement settings., content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderSettings" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
    patch:
      operationId: updateSyncFolderSettings
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSyncFolderSettingsRequest" } } } }
      responses:
        "200": { description: Updated device-local placement settings., content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderSettings" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/enrollment/preflight:
    post:
      operationId: preflightSyncFolderEnrollment
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootPathPreflightRequest" } } } }
      responses:
        "200": { description: Existing-folder enrollment preflight., content: { application/json: { schema: { $ref: "#/components/schemas/RootPathPreflightResult" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/enrollment/commit:
    post:
      operationId: commitSyncFolderEnrollment
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootEnrollmentCommitRequest" } } } }
      responses:
        "202": { description: Enrollment operation accepted., content: { application/json: { schema: { $ref: "#/components/schemas/RootOperation" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/selection/preflight:
    post:
      operationId: preflightSyncFolderSelection
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootSelectionPreflightRequest" } } } }
      responses:
        "200": { description: Aggregate selection preflight., content: { application/json: { schema: { $ref: "#/components/schemas/RootSelectionPreflightResult" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/selection/commit:
    post:
      operationId: commitSyncFolderSelection
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootSelectionCommitRequest" } } } }
      responses:
        "202": { description: Selection operation accepted., content: { application/json: { schema: { $ref: "#/components/schemas/RootOperationListResponse" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}/rebind/preflight:
    post:
      operationId: preflightSyncFolderRebind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/rootUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootRebindPreflightRequest" } } } }
      responses:
        "200": { description: Verified existing-copy rebind plan., content: { application/json: { schema: { $ref: "#/components/schemas/RootRebindPlan" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}/rebind/commit:
    post:
      operationId: commitSyncFolderRebind
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/rootUuid" }, { $ref: "#/components/parameters/contextRevision" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootRebindCommitRequest" } } } }
      responses:
        "202": { description: Rebind operation accepted., content: { application/json: { schema: { $ref: "#/components/schemas/RootOperation" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}/commands/{command}:
    post:
      operationId: commandSyncFolder
      parameters:
        - $ref: "#/components/parameters/libraryUuid"
        - $ref: "#/components/parameters/rootUuid"
        - $ref: "#/components/parameters/contextRevision"
        - name: command
          in: path
          required: true
          schema: { type: string, enum: [pause, resume, stop-sync] }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootCommandRequest" } } } }
      responses:
        "202": { description: Root command accepted., content: { application/json: { schema: { $ref: "#/components/schemas/RootOperation" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}/stop/preflight:
    post:
      operationId: preflightSyncFolderStop
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/rootUuid" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RootOperationFenceRequest" } } } }
      responses:
        "200": { description: Persisted root stop plan., content: { application/json: { schema: { $ref: "#/components/schemas/RootStopPlan" } } } }
        "400": { $ref: "#/components/responses/SyncFolderBadRequest" }
        "404": { $ref: "#/components/responses/SyncFolderNotFound" }
        "409": { $ref: "#/components/responses/SyncFolderConflict" }
        "500": { $ref: "#/components/responses/SyncFolderFailure" }
  /libraries/{libraryUuid}/sync-folders/{rootUuid}/stop/commit:
    post:
      operationId: commitSyncFolderStop
      parameters: [{ $ref: "#/components/parameters/libraryUuid" }, { $ref: "#/components/parameters/rootUuid" }, { $ref: "#/components/parameters/contextRevision" }]
