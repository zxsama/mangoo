          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDiagnosticsResponse"
  /plugin-auth/callback/{flowId}:
    get:
      operationId: completePluginAuthCallback
      security: []
      parameters:
        - name: flowId
          in: path
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Minimal fixed authorization completion page.
          content:
            text/html:
              schema: { type: string }
components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Megle-Session
  parameters:
    rootId:
      name: rootId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    folderId:
      name: folderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    fileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    tagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
    libraryUuid:
      name: libraryUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 128
    restoreUuid:
      name: restoreUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    conflictUuid:
      name: conflictUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    contextRevision:
      name: X-Megle-Context-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    rootIdQuery:
      name: rootId
      in: query
      schema:
        type: integer
        minimum: 1
    folderIdQuery:
      name: folderId
      in: query
      schema:
        type: integer
        minimum: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    offset:
      name: offset
      in: query
      description: Zero-based media row offset for viewport-windowed browsing.
      schema:
        type: integer
        minimum: 0
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    target:
      name: target
      in: query
      schema:
        type: string
        enum: [grid_320]
        default: grid_320
    thumbnailPriority:
      name: priority
      in: query
      schema:
        $ref: "#/components/schemas/ThumbnailPriority"
  schemas:
    LibraryLifecycleState:
      type: string
      enum: [creating, ready, removing, error, recovery-required]
    LibraryBindingState:
      type: string
      enum: [local-only, synchronizing, synchronized]
    LibraryAvailability:
      type: string
      enum: [available, unavailable]
    LibraryPreflightReason:
      type: string
      enum: [ok, invalid-path, invalid-name, cloud-sync-root, reparse-point, nested-library-root, not-empty, marker-mismatch, not-writable, insufficient-space, path-changed]
    LibrarySummary:
      type: object
      required: [libraryUuid, rootUuid, name, managedRoot, active, availability, lifecycleState, bindingState, contextRevision]
      properties:
        libraryUuid:
          type: string
          format: uuid
        rootUuid:
          type: string
          format: uuid
        name:
          type: string
        icon:
          anyOf:
            - type: string
            - type: "null"
        color:
          anyOf:
            - type: string
            - type: "null"
        managedRoot:
          type: string
        active:
          type: boolean
        availability:
          $ref: "#/components/schemas/LibraryAvailability"
        lifecycleState:
          $ref: "#/components/schemas/LibraryLifecycleState"
        bindingState:
          $ref: "#/components/schemas/LibraryBindingState"
        contextRevision:
          type: integer
          minimum: 0
    LibraryListResponse:
      type: object
