                $ref: "#/components/schemas/HostPluginProjection"
        "404":
          description: Plugin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Permissions, authentication, configuration or compatibility prevent enable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/disable:
    post:
      operationId: disablePlugin
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "200":
          description: Disabled intent accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostPluginProjection"
        "404":
          description: Plugin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/grants:
    put:
      operationId: updatePluginGrants
      parameters:
        - $ref: "#/components/parameters/pluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginGrantRequest"
      responses:
        "200":
          description: Grant set replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostPluginProjection"
        "400":
          description: A grant is duplicated or was not requested by the plugin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plugin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/retry:
    post:
      operationId: retryPlugin
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "202":
          description: Runtime retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
        "404":
          description: Plugin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The plugin is disabled, lacks required grants, or requires unavailable configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/versions/select:
    post:
      operationId: selectPluginVersion
      parameters:
        - $ref: "#/components/parameters/pluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginVersionRequest"
      responses:
        "202":
          description: Candidate verification and probation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
        "404":
          description: Plugin or requested plugin version not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another candidate version is already being verified or is in probation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/versions/rollback:
    post:
      operationId: rollbackPluginVersion
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "202":
          description: Known-good rollback accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
        "404":
          description: Plugin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No candidate probation or known-good version is available to roll back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plugins/{pluginId}/auth/begin:
    post:
      operationId: beginPluginAuth
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "201":
          description: Authorization flow started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAuthBeginResponse"
  /plugins/{pluginId}/auth/complete:
    post:
      operationId: completePluginAuth
      parameters:
        - $ref: "#/components/parameters/pluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginAuthCompleteRequest"
      responses:
        "202":
          description: Authorization result accepted for Provider validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
  /plugins/{pluginId}/auth/cancel:
    post:
      operationId: cancelPluginAuth
      parameters:
        - $ref: "#/components/parameters/pluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginAuthCancelRequest"
      responses:
        "202":
          description: Pending authorization flow cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
  /plugins/{pluginId}/auth/sign-out:
    post:
      operationId: signOutPlugin
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "202":
          description: Binding pause and secret deletion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCommandResponse"
  /plugins/{pluginId}/external-link:
    parameters:
      - $ref: "#/components/parameters/pluginId"
    post:
      operationId: resolvePluginExternalLink
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PluginExternalLinkRequest" } } } }
      responses:
        "200": { description: Exact current authorization or declared help link., content: { application/json: { schema: { $ref: "#/components/schemas/PluginExternalLink" } } } }
        "409": { description: The authorization flow is no longer current. }
  /plugins/{pluginId}/views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/pluginId"
      - name: viewId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z][A-Za-z0-9-]{0,63}$" }
    get:
      operationId: getPluginViewDocument
      responses:
        "200": { description: Verified self-contained plugin UI document. Does not launch a Provider or require an account., content: { application/json: { schema: { $ref: "#/components/schemas/HostPluginViewDocument" } } } }
        "404": { description: Plugin or declared view is missing. }
        "409": { description: Plugin is disabled, stopping, incompatible, untrusted, changed, or missing grants. }
  /plugins/{pluginId}/configuration:
    parameters:
      - $ref: "#/components/parameters/pluginId"
    get:
      operationId: getPluginConfiguration
      responses:
        "200": { description: Provider non-secret configuration projection., content: { application/json: { schema: { $ref: "#/components/schemas/PluginConfiguration" } } } }
    put:
      operationId: commitPluginConfiguration
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PluginConfigurationCommitRequest" } } } }
      responses:
        "200": { description: Configuration committed., content: { application/json: { schema: { $ref: "#/components/schemas/PluginConfiguration" } } } }
  /plugins/{pluginId}/configuration/plan:
    parameters:
      - $ref: "#/components/parameters/pluginId"
    post:
      operationId: planPluginConfiguration
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PluginConfigurationPlanRequest" } } } }
      responses:
        "200": { description: Configuration impact plan., content: { application/json: { schema: { $ref: "#/components/schemas/PluginConfigurationPlan" } } } }
  /plugins/{pluginId}/health:
    get:
      operationId: getPluginHealth
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "200":
          description: Current Host runtime health projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginHealthResponse"
  /plugins/{pluginId}/diagnostics:
    get:
      operationId: getPluginDiagnostics
      parameters:
        - $ref: "#/components/parameters/pluginId"
      responses:
        "200":
          description: Bounded redacted Provider diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDiagnosticsResponse"
  /plugin-auth/callback/{flowId}:
    get:
      operationId: completePluginAuthCallback
      security: []
      parameters:
        - name: flowId
          in: path
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Minimal fixed authorization completion page.
          content:
            text/html:
              schema: { type: string }
  /image-viewer/formats:
    get:
      operationId: getImageViewerFormats
      description: >-
        Image formats the standalone viewer opens, exactly the project decode
        support (built-in registry plus running decoder plugins). Available only
        while an enabled and granted Host-engine plugin provides image-viewer.v1.
      responses:
        "200":
          description: Supported lowercase dotted extensions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageViewerFormats"
        "403":
          description: The image viewer plugin is not enabled (code image_viewer_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /image-viewer/folder:
    get:
      operationId: getImageViewerFolder
      description: >-
        Non-recursive listing of the supported images in the folder of an
        absolute file or folder path. Ordering is a client preference.
      parameters:
        - $ref: "#/components/parameters/imageViewerPath"
      responses:
        "200":
          description: Supported images in the folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageViewerFolder"
        "400":
          description: Path is not a bounded absolute normalized path (code invalid_image_path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The image viewer plugin is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Folder is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /image-viewer/image:
    get:
      operationId: getImageViewerImage
      description: >-
        Paintable source for one image path. Browser-renderable images at or
        below the tier threshold stream verbatim; larger images return the same
        adaptive WebP tier as the Library preview, and full=true returns the
        original for zooming past fit. Browser-unrenderable and decoder-plugin
        formats always return WebP. x-mangoo-preview-tier names the representation;
        x-mangoo-source-width/height carry display dimensions when known.
      parameters:
        - $ref: "#/components/parameters/imageViewerPath"
        - name: viewportLongPx
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 16384 }
        - name: full
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Original image bytes or a WebP representation.
          headers:
            x-mangoo-preview-tier:
              description: original | preview_2048 | preview_3072 | preview_native | decoder
              schema: { type: string }
            x-mangoo-source-width:
              schema: { type: integer }
            x-mangoo-source-height:
              schema: { type: integer }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "400":
          description: Invalid path or query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The image viewer plugin is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Image file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Extension is not a supported image format (code unsupported_image_format).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The image could not be decoded (code image_decode_failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /image-viewer/thumbnail:
    get:
      operationId: getImageViewerThumbnail
      description: Small WebP thumbnail of one image path for the viewer filmstrip.
      parameters:
        - $ref: "#/components/parameters/imageViewerPath"
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 48, maximum: 512 }
      responses:
        "200":
          description: WebP thumbnail bounded to size on its longest side.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "403":
          description: The image viewer plugin is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Image file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The image could not be decoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /image-viewer/metadata:
    get:
      operationId: getImageViewerMetadata
      description: File facts, display dimensions and an EXIF summary for one image path.
      parameters:
        - $ref: "#/components/parameters/imageViewerPath"
      responses:
        "200":
          description: Image metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageViewerMetadata"
        "403":
          description: The image viewer plugin is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Image file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Mangoo-Session
  parameters:
    rootId:
      name: rootId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    folderId:
      name: folderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    fileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    tagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    imageViewerPath:
      name: path
      in: query
      required: true
      description: Absolute, normalized path to a local image file (or, for folder, a folder).
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    pluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
    libraryUuid:
      name: libraryUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 128
    restoreUuid:
      name: restoreUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    conflictUuid:
      name: conflictUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    rootUuid:
      name: rootUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    operationUuid:
      name: operationUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    planUuid:
      name: planUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    itemOrdinal:
      name: itemOrdinal
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    contextRevision:
      name: X-Mangoo-Context-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    rootIdQuery:
      name: rootId
      in: query
      schema:
        type: integer
        minimum: 1
    folderIdQuery:
      name: folderId
      in: query
      schema:
        type: integer
        minimum: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    offset:
      name: offset
      in: query
      description: Zero-based media row offset for viewport-windowed browsing.
      schema:
        type: integer
        minimum: 0
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    target:
      name: target
      in: query
      schema:
        type: string
        enum: [grid_320]
        default: grid_320
    thumbnailPriority:
      name: priority
      in: query
      schema:
        $ref: "#/components/schemas/ThumbnailPriority"
  responses:
    SyncFolderBadRequest:
      description: Invalid synchronized-folder request or path.
      content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderErrorResponse" } } }
    SyncFolderNotFound:
      description: Library, synchronized folder, operation, plan, or conflict not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderErrorResponse" } } }
    SyncFolderConflict:
      description: Stale revision, migration required, occupied path, or invalid lifecycle transition.
      content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderErrorResponse" } } }
    SyncFolderFailure:
      description: Unexpected persistence or runtime failure.
      content: { application/json: { schema: { $ref: "#/components/schemas/SyncFolderErrorResponse" } } }
  schemas:
    ImageViewerFormats:
      type: object
      additionalProperties: false
      required: [imageExtensions, browserRenderableExtensions, animatedExtensions, pluginExtensions]
      properties:
        imageExtensions: { type: array, items: { type: string } }
        browserRenderableExtensions: { type: array, items: { type: string } }
        animatedExtensions: { type: array, items: { type: string } }
        pluginExtensions: { type: array, items: { type: string } }
    ImageViewerFolderEntry:
      type: object
      additionalProperties: false
      required: [path, name, ext, sizeBytes, modifiedAtMs]
      properties:
        path: { type: string }
        name: { type: string }
        ext: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        modifiedAtMs: { type: integer }
    ImageViewerFolder:
      type: object
      additionalProperties: false
      required: [directory, entries, truncated]
      properties:
        directory: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/ImageViewerFolderEntry" } }
        truncated: { type: boolean }
    ImageViewerExif:
      type: object
      additionalProperties: false
      required: [make, model, lensModel, software, artist, copyright, dateTimeOriginal, exposureTime, fNumber, iso, focalLengthMm, focalLength35mm, exposureBiasEv, exposureProgram, meteringMode, flash, whiteBalance, colorSpace, orientation, pixelWidth, pixelHeight, gpsLatitude, gpsLongitude, gpsAltitudeM]
      properties:
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        lensModel: { type: string, nullable: true }
        software: { type: string, nullable: true }
        artist: { type: string, nullable: true }
        copyright: { type: string, nullable: true }
        dateTimeOriginal: { type: string, nullable: true }
        exposureTime: { type: string, nullable: true }
        fNumber: { type: number, nullable: true }
        iso: { type: integer, nullable: true }
        focalLengthMm: { type: number, nullable: true }
        focalLength35mm: { type: integer, nullable: true }
        exposureBiasEv: { type: number, nullable: true }
        exposureProgram: { type: string, nullable: true }
        meteringMode: { type: string, nullable: true }
        flash: { type: string, nullable: true }
        whiteBalance: { type: string, nullable: true }
        colorSpace: { type: string, nullable: true }
        orientation: { type: integer, nullable: true }
        pixelWidth: { type: integer, nullable: true }
        pixelHeight: { type: integer, nullable: true }
        gpsLatitude: { type: number, nullable: true }
        gpsLongitude: { type: number, nullable: true }
        gpsAltitudeM: { type: number, nullable: true }
    ImageViewerMetadata:
      type: object
      additionalProperties: false
      required: [path, name, directory, ext, sizeBytes, modifiedAtMs, createdAtMs, width, height, exif]
      properties:
        path: { type: string }
        name: { type: string }
        directory: { type: string }
        ext: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        modifiedAtMs: { type: integer }
        createdAtMs: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        exif: { anyOf: [{ $ref: "#/components/schemas/ImageViewerExif" }, { type: "null" }], nullable: true }
    PlaybackSession:
      type: object
      required: [id, src, expiresAt, renewAfterMs]
      properties:
        id: { type: string }
        src:
          type: string
          description: API-relative /playback/<capability>; only core-client resolves it against the configured API base.
        expiresAt:
          type: integer
          description: Expiry in Unix epoch milliseconds.
        renewAfterMs:
          type: integer
          minimum: 1
          maximum: 30000
          description: Suggested delay before authenticated renewal.
    LibraryLifecycleState:
      type: string
      enum: [creating, ready, removing, error, recovery-required]
    LibraryBindingState:
      type: string
      enum: [local-only, synchronizing, synchronized]
    LibraryAvailability:
      type: string
      enum: [available, unavailable]
    LibraryPreflightReason:
      type: string
      enum: [ok, invalid-path, invalid-name, cloud-sync-root, reparse-point, nested-library-root, not-empty, marker-mismatch, not-writable, insufficient-space, path-changed, content-roots-required, database-content-overlap, content-roots-overlap]
    LibraryPreflightPathRole:
      type: string
      enum: [database, content-root]
    LibraryContentRootInput:
      type: object
      additionalProperties: false
      required: [path, createIfMissing]
      properties:
        path:
          type: string
          minLength: 1
        createIfMissing:
          type: boolean
          description: Permits creation of a missing content folder; does not establish cleanup ownership.
    LibrarySummary:
      type: object
      required: [libraryUuid, rootUuid, name, databasePath, active, availability, lifecycleState, bindingState, contextRevision]
      properties:
        libraryUuid:
          type: string
          format: uuid
        rootUuid:
          type: string
          format: uuid
        name:
          type: string
        icon:
          anyOf:
            - type: string
            - type: "null"
        color:
          anyOf:
            - type: string
            - type: "null"
        databasePath:
          type: string
          description: Exact directory containing the Library Catalog and internal storage, separate from content roots.
        active:
          type: boolean
        availability:
          $ref: "#/components/schemas/LibraryAvailability"
        lifecycleState:
          $ref: "#/components/schemas/LibraryLifecycleState"
        bindingState:
          $ref: "#/components/schemas/LibraryBindingState"
        contextRevision:
          type: integer
          minimum: 0
    LibraryListResponse:
      type: object
      required: [items, contextRevision]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySummary"
        contextRevision:
          type: integer
          minimum: 0
    ActiveLibraryResponse:
      type: object
      required: [library, contextRevision, runtimeGeneration]
      properties:
        library:
          anyOf:
            - $ref: "#/components/schemas/LibrarySummary"
            - type: "null"
        contextRevision:
          type: integer
          minimum: 0
        runtimeGeneration:
          type: integer
          minimum: 0
    LibraryPreflightRequest:
      type: object
      additionalProperties: false
      required: [name, databasePath, contentRoots]
      properties:
        name:
          type: string
          minLength: 1
        databasePath:
          type: string
          minLength: 1
        contentRoots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LibraryContentRootInput"
    LibraryPreflightResponse:
      type: object
      required: [ok, reason, pathRole, rootIndex, normalizedDatabasePath, normalizedContentRoots, preflightToken]
      description: Normalized paths and token are non-null only on success. Failure preserves the caller's draft; success preserves root order and creation flags.
      allOf:
        - if:
            properties:
              ok: { const: true }
          then:
            properties:
              reason: { const: ok }
              pathRole: { type: "null" }
              rootIndex: { type: "null" }
              normalizedDatabasePath: { type: string }
              normalizedContentRoots: { type: array }
              preflightToken: { type: string, minLength: 1 }
          else:
            properties:
              reason: { not: { const: ok } }
              normalizedDatabasePath: { type: "null" }
              normalizedContentRoots: { type: "null" }
              preflightToken: { type: "null" }
      properties:
        ok:
          type: boolean
        reason:
          $ref: "#/components/schemas/LibraryPreflightReason"
        pathRole:
          anyOf:
            - $ref: "#/components/schemas/LibraryPreflightPathRole"
            - type: "null"
        rootIndex:
          description: Zero-based index in the original request, or null for a whole-plan or Database error.
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        normalizedDatabasePath:
          anyOf:
