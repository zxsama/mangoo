    post:
      operationId: cancelBulkThumbnailCache
      description: >-
        Cancel every pending whole-library (bulk-priority) thumbnail task,
        leaving viewport/selected/ahead tasks and generated blobs untouched.
        Used when the generation mode is not whole-library ("renderedOnly" /
        "cacheOnly") to drop a leftover bulk queue from a previous session.
      responses:
        "200":
          description: Pending bulk thumbnail tasks cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailCacheCancelBulkResponse"
  /media/{fileId}/playback-sessions:
    post:
      operationId: createPlaybackSession
      description: >-
        Creates a single-video grant bound to the active Library/context, source
        identity and root binding. Normal session and Library mutation headers
        are required. At most 8 live grants; renewal TTL 60 seconds, absolute
        lifetime 10 minutes. No video decoding or full-file buffering occurs.
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "201":
          description: Restricted playback grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "401":
          description: Session authentication required.
        "404":
          description: Video source missing.
        "409":
          description: Library or source changed, or file is not an original video.
        "429":
          description: Live grant limit reached.
  /playback-sessions/{sessionId}/renew:
    post:
      operationId: renewPlaybackSession
      description: Revalidates the same source and renews for at most 60 seconds without extending the absolute lifetime.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Grant renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "401":
          description: Session authentication required.
        "404":
          description: Grant expired or revoked.
        "409":
          description: Library or source identity changed.
  /playback-sessions/{sessionId}:
    delete:
      operationId: revokePlaybackSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Grant and response-body ownership revoked; also returned if already absent.
        "401":
          description: Session authentication required.
        "409":
          description: Library mutation context changed.
  /playback/{capability}:
    parameters:
      - name: capability
        in: path
        required: true
        schema: { type: string }
      - name: Range
        in: header
        schema: { type: string }
    get:
      operationId: getPlaybackStream
      security: []
      description: >-
        Only this GET/HEAD route accepts the short-lived single-video capability.
        It never accepts a long-lived session token in the URL. Serves one byte
        range including suffix/open-ended forms. Malformed, multiple, zero-suffix
        and unsatisfiable ranges return 416 with Content-Range bytes */length.
        No Range gives 200; valid Range gives 206 with exact Content-Range and
        Content-Length. All responses advertise Accept-Ranges bytes and no-store.
        At most 2 response bodies per grant with 64 KiB read chunks; body drop,
        revocation, expiry, Library activation, root/source change stop reading.
      responses:
        "200":
          description: Full representation streamed on demand, never buffered in full.
        "206":
          description: Requested byte range.
        "404":
          description: Missing, expired or revoked grant/source.
        "409":
          description: Source or active Library changed.
        "416":
          description: Invalid or unsatisfiable byte range.
          headers:
            Content-Range:
              schema: { type: string }
        "429":
          description: Concurrent stream limit reached.
    head:
      operationId: headPlaybackStream
      security: []
      description: Identical status and headers to GET including Range, without reading or returning a body.
      responses:
        "200": { description: Representation metadata. }
        "206": { description: Byte range metadata. }
        "404": { description: Missing or expired grant/source. }
        "409": { description: Source or Library changed. }
        "416": { description: Invalid or unsatisfiable range. }
  /media/{fileId}/preview:
    get:
      operationId: getPreview
      description: >-
        Resolves the best preview source for one media item. Browser-renderable
        images at or below the tier threshold, and every video, stream the
        original indexed bytes unchanged. Larger images return an adaptive
        downscaled WebP tier, and browser-unrenderable images return a
        transcoded WebP. The x-mangoo-preview-tier response header names which
        representation was served.
      parameters:
        - $ref: "#/components/parameters/fileId"
        - name: viewportLongPx
          in: query
          required: false
          description: >-
            Longest side of the preview viewport in CSS pixels. Omit to receive
            the original bytes verbatim. Values above the maximum are clamped,
            not rejected; a non-integer value is a 400.
          schema:
            type: integer
            minimum: 1
            maximum: 16384
      responses:
        "200":
          description: Original indexed media bytes, or a WebP preview representation.
          headers:
            x-mangoo-preview-tier:
              description: original | preview_2048 | preview_3072 | preview_native
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Malformed viewportLongPx query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Media item or source file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            Preview generation panicked. A generation FAILURE (no decoder for
            the format, decoder binary missing, unreachable source) is not an
            error here — it degrades to the original bytes with
            x-mangoo-preview-tier: original — so only an internal panic, which is
            a bug, reaches this status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
