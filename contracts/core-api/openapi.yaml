              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Folder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Folder cannot be scanned from its current source state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/thumbnail-cache:
    post:
      operationId: enqueueThumbnailCache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailCacheTaskRequest"
      responses:
        "202":
          description: Missing or stale thumbnail cache candidates enqueued at bulk priority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailCacheEnqueueResponse"
        "400":
          description: Unsupported thumbnail cache refresh mode or invalid scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/thumbnail-priority-scope:
    post:
      operationId: syncThumbnailPriorityScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailPriorityScopeSyncRequest"
      responses:
        "202":
          description: Pending thumbnail priorities rebalanced for the current root scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Root not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: Task cancellation accepted and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Task is already finished and cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{taskId}/retry:
    post:
      operationId: retryTask
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        "202":
          description: Failed or cancelled task reset to a pending retry attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRootResponse"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Task cannot be retried from its current status or source state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /file-ops/rename:
