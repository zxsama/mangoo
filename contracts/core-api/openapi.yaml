      type: object
      required: [fileId, target, state, shortSidePx, outputFormat, width, height, byteSize, servedBy, asset, error, updatedAt]
      properties:
        fileId:
          type: integer
          minimum: 1
        target:
          type: string
          enum: [grid_320]
        state:
          type: string
          enum: [pending, queued, ready, failed, skipped_small]
        shortSidePx:
          type: integer
          minimum: 320
          maximum: 320
        outputFormat:
          type: string
          enum: [image/webp]
        width:
          type: integer
          nullable: true
          minimum: 1
        height:
          type: integer
          nullable: true
          minimum: 1
        byteSize:
          type: integer
          nullable: true
          minimum: 1
        servedBy:
          type: string
          nullable: true
          enum: [db_blob]
        asset:
          anyOf:
            - $ref: "#/components/schemas/ThumbnailAsset"
            - type: "null"
        error:
          type: string
          nullable: true
        updatedAt:
          type: integer
          nullable: true
    ThumbnailCacheScopeParams:
      type: object
      properties:
        rootId:
          type: integer
          minimum: 1
        folderId:
          type: integer
          minimum: 1
        includeDescendants:
          type: boolean
    ThumbnailCacheTaskRequest:
      allOf:
        - $ref: "#/components/schemas/ThumbnailCacheScopeParams"
        - type: object
          required: [refreshMode]
          properties:
            fileIds:
              type: array
              items:
                type: integer
                minimum: 1
            refreshMode:
              type: string
              enum: [missingOnly, staleOrMissing, retryFailedAndStale]
            limit:
              type: integer
              minimum: 1
            afterFileId:
              type: integer
              minimum: 0
              description: >-
                Keyset cursor for the whole-library "generate all" pass. When
                set, Core scans one bounded window of files past this id and
                returns nextCursor; the client advances it batch by batch. Omit
                for folder-scoped or explicit-fileIds enqueues.
    ThumbnailCacheStatsResponse:
      type: object
      required:
        [
          cachedCount,
          missingCount,
          staleCount,
          failedCount,
          pendingCandidateCount,
          totalBlobBytes,
          activeBulkTaskCount,
        ]
      properties:
        cachedCount:
          type: integer
          minimum: 0
        missingCount:
          type: integer
          minimum: 0
        staleCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        pendingCandidateCount:
          type: integer
          minimum: 0
        totalBlobBytes:
          type: integer
          minimum: 0
        activeBulkTaskCount:
          type: integer
          minimum: 0
    ThumbnailFailureRecord:
      type: object
      required: [fileId, folderId, rootId, relativePath, failureKind, error, updatedAt]
      properties:
        fileId:
          type: integer
          minimum: 1
        folderId:
          type: integer
          minimum: 1
        rootId:
          type: integer
          minimum: 1
        relativePath:
          type: string
        failureKind:
          type: string
        error:
          type: string
        updatedAt:
          type: integer
          minimum: 0
    ThumbnailFailureListResponse:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ThumbnailFailureRecord"
        truncated:
          type: boolean
    ThumbnailCacheSnapshotResponse:
      allOf:
        - $ref: "#/components/schemas/ThumbnailCacheStatsResponse"
        - type: object
          required: [failureDetails, failureDetailsTruncated]
          properties:
            failureDetails:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ThumbnailFailureRecord"
            failureDetailsTruncated:
              type: boolean
    ThumbnailCacheEnqueueResponse:
      allOf:
        - $ref: "#/components/schemas/ThumbnailCacheStatsResponse"
        - type: object
          required: [acceptedCount]
          properties:
            acceptedCount:
              type: integer
              minimum: 0
            nextCursor:
              type: integer
              minimum: 0
              description: >-
                Keyset cursor to resume the whole-library "generate all" pass
                from, or omitted once the scan reaches the end of the scope.
                Absent for folder-scoped or explicit-fileIds enqueues.
    ThumbnailCacheClearResponse:
      type: object
      required: [cleared, deletedBlobCount, resetThumbnailCount]
      properties:
        cleared:
          type: boolean
        deletedBlobCount:
          type: integer
          minimum: 0
        resetThumbnailCount:
          type: integer
          minimum: 0
    ThumbnailCacheCancelBulkResponse:
      type: object
      required: [cancelledCount]
      properties:
        cancelledCount:
          type: integer
          minimum: 0
    MediaListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaRecord"
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
    TagRecord:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          nullable: true
    TagListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TagRecord"
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
    DeleteTagResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    UserMetadataRecord:
      type: object
      required: [fileId, rating, favorite, note, tagIds, updatedAt]
      properties:
        fileId:
          type: integer
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
        favorite:
          type: boolean
        note:
          type: string
          nullable: true
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
        updatedAt:
          type: integer
    UserMetadataUpdate:
      type: object
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
        favorite:
          type: boolean
        note:
          type: string
          nullable: true
    FileTagsResponse:
      type: object
      required: [fileId, tagIds]
      properties:
        fileId:
          type: integer
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
    AddFileTagRequest:
      type: object
      required: [tagId]
      properties:
        tagId:
          type: integer
          minimum: 1
    SetFileTagsRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
    FileOperationKind:
      type: string
      enum: [rename, move, delete_recycle, delete_permanent]
    FileOperationStatus:
      type: string
      enum: [succeeded, failed]
    FileOperationRecord:
      type: object
      required:
        [
          id,
          operation,
          sourcePath,
          targetPath,
          status,
          createdAt,
          finishedAt,
          error
        ]
      properties:
        id:
          type: integer
        operation:
          $ref: "#/components/schemas/FileOperationKind"
        sourcePath:
          type: string
        targetPath:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/FileOperationStatus"
        createdAt:
          type: integer
        finishedAt:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        operationGroupId:
          type: string
          nullable: true
    FileOperationListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileOperationRecord"
        nextCursor:
          type: string
          nullable: true
    FileOperationsResponse:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/FileOperationRecord"
    RenameRequest:
      type: object
      required: [newName]
      properties:
        fileId:
          type: integer
          minimum: 1
        folderId:
          type: integer
          minimum: 1
        newName:
          type: string
    MoveRequest:
      type: object
      required: [targetFolderId]
      properties:
        fileIds:
          type: array
          items:
            type: integer
            minimum: 1
        folderIds:
          type: array
          items:
            type: integer
            minimum: 1
        targetFolderId:
          type: integer
          minimum: 1
    DeleteRequest:
      type: object
      properties:
        fileIds:
          type: array
          items:
            type: integer
            minimum: 1
        folderIds:
          type: array
          items:
            type: integer
            minimum: 1
        permanent:
          type: boolean
    PluginCapability:
      type: string
      enum: [sync-provider.v1]
    PluginRuntimeState:
      type: string
      enum: [disabled, permission-required, starting, ready, degraded, crashed-backoff, incompatible, configuration-required]
    PluginAuthState:
      type: string
      enum: [signed-out, authorization-required, authorizing, authenticated, expired, error]
    PluginPermission:
      oneOf:
        - type: object
          required: [kind, schemes, hosts]
          additionalProperties: false
          properties:
            kind: { const: network }
            schemes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { const: https }
            hosts:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                maxLength: 253
                pattern: "^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))+$"
        - type: object
          required: [kind, mode]
          additionalProperties: false
          properties:
            kind: { const: oauth-loopback }
            mode: { const: ephemeral-only }
        - type: object
          required: [kind, namespace, operations]
          additionalProperties: false
          properties:
            kind: { const: secret }
            namespace:
              type: string
              maxLength: 64
              pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
            operations:
              type: array
              minItems: 1
              uniqueItems: true
              items: { enum: [read, write, delete] }
        - type: object
          required: [kind, maxBytes]
          additionalProperties: false
          properties:
            kind: { const: temp-storage }
            maxBytes: { type: integer, minimum: 1, maximum: 1073741824 }
    HostPluginProjection:
      type: object
      required: [pluginId, selectedVersion, knownGoodVersion, enabledIntent, runtimeState, authState, capabilities, requestedPermissions, grantedPermissions, permissionRequired, accountUuid, accountDisplayName, compatibilityReason, backoffUntil, lastHealthyAt, lastErrorCode, lastErrorDetail]
      properties:
        pluginId: { type: string }
        selectedVersion: { type: string }
        knownGoodVersion: { type: string, nullable: true }
        enabledIntent: { type: boolean }
        runtimeState: { $ref: "#/components/schemas/PluginRuntimeState" }
        authState:
          type: string
          enum: [signed-out, authorization-required, authorizing, authenticated, expired, error]
          nullable: true
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/PluginCapability" }
        requestedPermissions:
          type: array
          items: { $ref: "#/components/schemas/PluginPermission" }
        grantedPermissions:
          type: array
          items: { $ref: "#/components/schemas/PluginPermission" }
        permissionRequired: { type: boolean }
        accountUuid: { type: string, nullable: true }
        accountDisplayName: { type: string, nullable: true }
        compatibilityReason: { type: string, nullable: true }
        backoffUntil: { type: integer, nullable: true }
        lastHealthyAt: { type: integer, nullable: true }
        lastErrorCode: { type: string, nullable: true }
        lastErrorDetail: { type: string, nullable: true }
    HostPluginListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HostPluginProjection" }
    PluginDiscoveryError:
      type: object
      required: [manifestPath, message]
      properties:
        manifestPath:
          type: string
        message:
          type: string
    PluginDiscoveryResponse:
      type: object
      required: [discovered, errors]
      properties:
        discovered:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PluginDiscoveryError"
    PluginCommandResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    PluginGrantRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/PluginPermission" }
    PluginVersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
    PluginAuthBeginResponse:
      type: object
      required: [authorizationUrl, flowId, expiresAt]
      properties:
        authorizationUrl: { type: string }
        flowId: { type: string }
        expiresAt: { type: integer }
    PluginAuthCompleteRequest:
      type: object
      required: [flowId, result]
      additionalProperties: false
      properties:
        flowId: { type: string, minLength: 1, maxLength: 160 }
        result:
          type: object
          maxProperties: 8
          additionalProperties: { type: string }
    PluginHealthResponse:
      type: object
      required: [state, lastHealthyAt, lastErrorCode]
      properties:
        state: { $ref: "#/components/schemas/PluginRuntimeState" }
        lastHealthyAt: { type: integer, nullable: true }
        lastErrorCode: { type: string, nullable: true }
    PluginDiagnosticsResponse:
      type: object
      required: [generatedAt, entries]
      properties:
        generatedAt: { type: integer }
        entries:
          type: array
          items: { type: object, additionalProperties: true }
    MediaPositionResponse:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
