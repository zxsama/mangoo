  /search:
    get:
      operationId: searchMedia
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/rootIdQuery"
        - $ref: "#/components/parameters/folderIdQuery"
        - name: includeDescendants
          in: query
          description: Include media from descendant folders when folderId is set.
          schema:
            type: boolean
        - name: kind
          in: query
          schema:
            type: string
            enum: [image, video, other]
        - name: minRating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: tagId
          in: query
          description: Repeatable; results must match ALL provided tag ids.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                mtime_desc,
                mtime_asc,
                name_asc,
                name_desc,
                rating_desc,
                rating_asc
              ]
            default: mtime_desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Keyset-paged search result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
        "400":
          description: Invalid search query parameter or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
