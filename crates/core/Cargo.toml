[package]
name = "megle-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-extra = { version = "0.9", features = ["query"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
image = "0.25"
notify = "8.2.0"
psd = "0.3.5"
rawler = "0.7.2"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
trash = "5"
uuid.workspace = true
url = "2"
walkdir.workspace = true
webp = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
